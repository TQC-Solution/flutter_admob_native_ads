name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Test release automation
        run: node --test .github/scripts/release.test.cjs

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Publish dry-run
        run: flutter pub publish --dry-run

  release:
    name: Tag and publish new version
    needs: analyze-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'TQC-Solution/flutter_admob_native_ads'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Create version tag and start publishing
        uses: actions/github-script@v7
        with:
          script: |
            const release = require('./.github/scripts/release.cjs');
            await release({ github, context, core });
